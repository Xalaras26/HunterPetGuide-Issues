name: "Unlock & Loot: Bug report"
description: Something in Unlock & Loot (rogue lockpicking) doesn't work or shows something wrong.
title: "[Unlock & Loot] [Bug] "
labels: ["bug", "Unlock & Loot"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more details, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the AddOn List (Esc > AddOns).
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Your character
      description: Class, level and Lockpicking skill.
      placeholder: Rogue level 53, Lockpicking 265
    validations:
      required: true
  - type: input
    id: box
    attributes:
      label: Which box?
      description: The name of the lockbox, if it's about one box.
      placeholder: Steel Lockbox
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: The button says 3 boxes, but I have 4 locked ones.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we see it too?
      description: The clicks or steps that lead to it.
      placeholder: |
        1. Loot a lockbox
        2. Click the button
        3. ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Screenshots of the button, the box list or a Lua error help a lot.
  - type: textarea
    id: errors
    attributes:
      label: Lua error (if any)
      description: If the game showed an error message, paste it here.
      render: text
