name: Bug report
description: Something in one of my addons doesn't work or shows something wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more details, the faster it gets fixed.
  - type: dropdown
    id: addon
    attributes:
      label: Which addon?
      options:
        - Hunter Pet Guide
        - Unlock & Loot
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the AddOn List (Esc > AddOns), or in the guide's bottom-left corner.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Your character
      description: "Race/class and level. Hunters: your pet's family and level. Rogues: your Lockpicking skill."
      placeholder: Orc hunter level 11, Boar level 8
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Guide path (Hunter Pet Guide only)
      options:
        - Custom
        - Leveling
        - AoE
        - PvP
        - Skill hunt
        - Not chosen yet
  - type: input
    id: step
    attributes:
      label: Which step or box?
      description: "Hunter Pet Guide: the step name. Unlock & Loot: the lockbox name."
      placeholder: "Skill upgrades (pet lvl 8) / Steel Lockbox"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: The arrow points to Westfall, but I'm Horde.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we see it too?
      description: The clicks or steps that lead to it.
      placeholder: |
        1. Open Options
        2. Click Skill hunt
        3. ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Screenshots of the addon window or a Lua error help a lot.
  - type: textarea
    id: errors
    attributes:
      label: Lua error (if any)
      description: If the game showed an error message, paste it here.
      render: text
