name: "Hunter Pet Guide: Bug report"
description: Something in Hunter Pet Guide doesn't work or shows something wrong.
title: "[Hunter Pet Guide] [Bug] "
labels: ["bug", "Hunter Pet Guide"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The more details, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the guide's bottom-left corner.
      placeholder: v2.18.5
    validations:
      required: true
  - type: input
    id: character
    attributes:
      label: Your character
      description: Race, level, and your pet's family and level.
      placeholder: Orc level 11, Boar level 8
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Guide path
      options:
        - Custom
        - Leveling
        - AoE
        - PvP
        - Skill hunt
        - Not chosen yet
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step?
      description: The step name, if it's about a step.
      placeholder: "Skill upgrades (pet lvl 8)"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: The arrow points to Westfall, but I'm Horde.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How can we see it too?
      description: The clicks or steps that lead to it.
      placeholder: |
        1. Open Options
        2. Click Skill hunt
        3. ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Screenshots of the guide, the arrow or a Lua error help a lot.
  - type: textarea
    id: errors
    attributes:
      label: Lua error (if any)
      description: If the game showed an error message, paste it here.
      render: text
