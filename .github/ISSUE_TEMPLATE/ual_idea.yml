name: "Unlock & Loot: Idea"
description: Suggest a new feature or a change to Unlock & Loot.
title: "[Unlock & Loot] [Idea] "
labels: ["idea", "Unlock & Loot"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the addon to do?
      placeholder: Show the lockbox count on my bag button.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: When would you use it?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or examples
      description: Optional - drag images here.
